name: ci
on:
  push:
  pull_request:
jobs:
  test:
    # GitHub runners have no GPU: this runs the PyTorch fallback paths and
    # skips tests marked `cuda`. GPU tests run locally (see RESULTS.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Test
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: pytest -q
